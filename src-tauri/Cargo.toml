[package]
name = "repopuck"
version = "0.1.0"
description = "A tray-first Git client for Windows"
authors = ["RepoPuck"]
edition = "2021"

[lib]
name = "repopuck_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repopuck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
