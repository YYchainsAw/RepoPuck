[package]
name = "repopuck"
version = "0.1.0"
description = "A tray-first Git client for Windows"
authors = ["RepoPuck"]
edition = "2021"

[lib]
name = "repopuck_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repopuck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
