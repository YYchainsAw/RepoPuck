name: "✨ 功能建议 / Feature request"
description: "提出符合轻量桌面 Git 工作流的新能力 / Propose an improvement to the lightweight desktop Git workflow"
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        RepoPuck 专注于让 Windows 上常见的 Git 操作更快、更安静。相比功能清单，我们更重视清晰的用户问题和高频工作流。

        RepoPuck focuses on a fast, quiet everyday Git workflow on Windows. A clear user problem matters more than a long feature list.

  - type: checkboxes
    id: preflight
    attributes:
      label: "提交前检查 / Preflight"
      options:
        - label: "我已搜索现有 Issue 和 Release Notes，未发现相同建议。/ I found no matching issue or release note."
          required: true
        - label: "这个建议不会要求 RepoPuck 保存 GitHub 密码、令牌、SSH Key 或其他凭据。/ This request does not require RepoPuck to store GitHub passwords, tokens, SSH keys, or other credentials."
          required: true

  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem"
      description: "请描述目前工作流中的具体阻力，而不是只写功能名称 / Describe the workflow friction, not only the feature name"
      placeholder: "当我……时，我不得不……，因此…… / When I ..., I have to ..., which causes ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposed solution"
      description: "说明入口、关键步骤和完成状态 / Explain the entry point, key steps, and success state"
      placeholder: "用户从……进入，完成……后看到…… / The user enters from ..., completes ..., and sees ..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "功能区域 / Product area"
      options:
        - "变更、暂存与 Diff / Changes, staging, and diff"
        - "提交与推送 / Commit and push"
        - "仓库与分支 / Repositories and branches"
        - "桌面入口与窗口 / Desktop entry and windows"
        - "AI 提交信息 / AI commit messages"
        - "设置、本地化与无障碍 / Settings, localization, and accessibility"
        - "性能、安装与更新 / Performance, installation, and updates"
        - "其他 / Other"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "使用频率 / Expected frequency"
      options:
        - "每天多次 / Multiple times a day"
        - "每天一次左右 / About once a day"
        - "每周几次 / A few times a week"
        - "偶尔 / Occasionally"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "当前替代方案 / Current workaround"
      placeholder: "你现在如何完成这件事？/ How do you accomplish this today?"

  - type: textarea
    id: scope
    attributes:
      label: "轻量化边界 / Lightweight scope"
      description: "哪些内容可以不做，仍能解决核心问题？/ What can be left out while still solving the core problem?"
      placeholder: "最小可用方案只需要…… / The smallest useful version only needs ..."

  - type: textarea
    id: references
    attributes:
      label: "参考与草图 / References and mockups"
      description: "可以拖入图片或链接，请说明希望借鉴的交互而非只写产品名 / Attach images or links and explain the interaction to learn from"

  - type: dropdown
    id: contribution
    attributes:
      label: "参与意愿 / Contribution"
      options:
        - "我可以参与实现 / I can help implement"
        - "我可以参与设计或测试 / I can help design or test"
        - "我可以提供更多使用场景 / I can provide more context"
        - "目前只能提出建议 / Suggestion only for now"
