name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0
  PNPM_VERSION: 10.18.3
  RUST_VERSION: 1.97.1

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust checks
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  windows-msi:
    name: Windows MSI package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Clean previous MSI bundle output
        shell: pwsh
        run: |
          $workspaceRoot = [System.IO.Path]::GetFullPath(
            $env:GITHUB_WORKSPACE
          ).TrimEnd('\') + '\'
          $bundleDirectory = [System.IO.Path]::GetFullPath(
            (Join-Path $workspaceRoot "src-tauri/target/release/bundle/msi")
          )
          if (
            -not $bundleDirectory.StartsWith(
              $workspaceRoot,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -or
            (Split-Path -Leaf $bundleDirectory) -ne "msi"
          ) {
            throw "Refusing to clean unexpected bundle path: $bundleDirectory"
          }
          if (Test-Path -LiteralPath $bundleDirectory) {
            Remove-Item -LiteralPath $bundleDirectory -Recurse -Force
          }

      - name: Build release MSI
        run: pnpm tauri build --bundles msi --ci

      - name: Verify MSI bundle
        id: msi_bundle
        shell: pwsh
        run: |
          $version = (
            Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version
          $expectedPattern = "RepoPuck_$($version)_*.msi"
          $msiFiles = @(
            Get-ChildItem `
              -LiteralPath "src-tauri/target/release/bundle/msi" `
              -Filter $expectedPattern `
              -File
          )
          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one '$expectedPattern' bundle, found $($msiFiles.Count)."
          }
          if ($msiFiles[0].Length -le 0) {
            throw "MSI bundle is empty: $($msiFiles[0].FullName)"
          }
          $msiPath = $msiFiles[0].FullName
          "msi_path=$msiPath" >> $env:GITHUB_OUTPUT
          Get-Item -LiteralPath $msiPath | Select-Object FullName, Length

      - name: Smoke test silent MSI install and uninstall
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi_bundle.outputs.msi_path }}
        run: |
          & ".github/scripts/Test-MsiInstall.ps1" `
            -MsiPath $env:MSI_PATH `
            -LogDirectory (Join-Path $env:RUNNER_TEMP "repopuck-msi-smoke")

      - name: Upload MSI smoke-test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repopuck-msi-smoke-logs-${{ github.sha }}
          path: ${{ runner.temp }}/repopuck-msi-smoke/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Windows release-candidate assets
        id: release_assets
        shell: pwsh
        env:
          BUILT_MSI_PATH: ${{ steps.msi_bundle.outputs.msi_path }}
        run: |
          $version = (
            Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version
          & ".github/scripts/New-ReleaseAssets.ps1" `
            -MsiPath $env:BUILT_MSI_PATH `
            -PortableExePath "src-tauri/target/release/repopuck.exe" `
            -Version $version `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "release-assets") `
            -Repository $env:GITHUB_REPOSITORY `
            -ReleaseTag "v$version"

      - name: Upload Windows release-candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repopuck-windows-release-candidate-${{ github.sha }}
          path: |
            ${{ steps.release_assets.outputs.msi_path }}
            ${{ steps.release_assets.outputs.portable_zip_path }}
            ${{ steps.release_assets.outputs.winget_manifest_zip_path }}
            ${{ steps.release_assets.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 7
