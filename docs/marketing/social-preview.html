<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoPuck social preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
          Helvetica, Arial, sans-serif;
        background: #f6f8fa;
        color: #1f2328;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 56% 44%;
        background:
          radial-gradient(circle at 8% 6%, rgba(31, 136, 61, 0.14), transparent 30%),
          linear-gradient(135deg, #ffffff 0%, #f6f8fa 54%, #eaeef2 100%);
      }

      body::before {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#8c959f 0.8px, transparent 0.8px);
        background-size: 24px 24px;
        opacity: 0.18;
        content: "";
      }

      .copy {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 66px 44px 60px 78px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 36px;
      }

      .brand img {
        width: 84px;
        height: 84px;
        border: 1px solid rgba(31, 35, 40, 0.12);
        border-radius: 24px;
        box-shadow: 0 12px 30px rgba(31, 35, 40, 0.14);
      }

      .brand-name {
        font-size: 58px;
        font-weight: 760;
        letter-spacing: -2.4px;
        line-height: 1;
      }

      .eyebrow {
        margin-bottom: 14px;
        color: #1f883d;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 570px;
        margin: 0;
        font-size: 58px;
        font-weight: 760;
        letter-spacing: -2.6px;
        line-height: 1.04;
      }

      .workflow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 28px 0 34px;
        color: #57606a;
        font-size: 24px;
        font-weight: 620;
      }

      .workflow span {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 15px;
        border: 1px solid #d0d7de;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
      }

      .workflow b {
        color: #1f883d;
        font-size: 18px;
      }

      .proof {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        max-width: 560px;
      }

      .proof span {
        padding: 9px 13px;
        border: 1px solid #d8dee4;
        border-radius: 8px;
        background: #ffffff;
        color: #57606a;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(31, 35, 40, 0.04);
      }

      .product {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .product::before {
        position: absolute;
        top: -85px;
        right: -70px;
        width: 600px;
        height: 810px;
        border-radius: 120px 0 0 120px;
        background:
          radial-gradient(circle at 35% 28%, rgba(47, 129, 247, 0.72), transparent 30%),
          radial-gradient(circle at 70% 68%, rgba(31, 136, 61, 0.55), transparent 34%),
          #0d1117;
        box-shadow: -24px 0 80px rgba(31, 35, 40, 0.2);
        transform: rotate(5deg);
        content: "";
      }

      .panel-shell {
        position: relative;
        width: 368px;
        height: 572px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 24px;
        background: #ffffff;
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.38),
          0 0 0 8px rgba(255, 255, 255, 0.08);
        transform: translate(-4px, 6px);
      }

      .panel-shell img {
        display: block;
        width: 334px;
        height: auto;
        margin: 0 auto;
      }

      .puck {
        position: absolute;
        right: 66px;
        bottom: 44px;
        width: 104px;
        height: 104px;
        border: 5px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.32);
      }

      .puck img {
        width: 100%;
        height: 100%;
      }

      .open-source {
        position: absolute;
        z-index: 3;
        right: 64px;
        top: 43px;
        padding: 9px 14px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(13, 17, 23, 0.7);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body>
    <main class="copy">
      <div class="brand">
        <img src="../../src-tauri/icons/128x128.png" alt="" />
        <div class="brand-name">RepoPuck</div>
      </div>

      <div class="eyebrow">Git, one click away.</div>
      <h1>Stay in flow.<br />Ship the change.</h1>

      <div class="workflow" aria-label="Stage, Commit, Push">
        <span>Stage</span><b>→</b><span>Commit</span><b>→</b><span>Push</span>
      </div>

      <div class="proof">
        <span>Windows 10 &amp; 11</span>
        <span>Open source</span>
        <span>No GitHub login</span>
      </div>
    </main>

    <section class="product" aria-label="RepoPuck application preview">
      <div class="open-source">MIT · Tauri · Rust</div>
      <div class="panel-shell">
        <img src="../qa/repopuck-panel-success.png" alt="" />
      </div>
      <div class="puck">
        <img src="../qa/v020/puck-launcher.png" alt="" />
      </div>
    </section>
  </body>
</html>
